version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    ports:
      - "8001:8001"
    environment:
      - NODE_ID=node_1
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8001
      - NODE_COUNT=3
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    command: python -c "from src.nodes.lock_manager import DistributedLockManager; import asyncio; lm = DistributedLockManager('node_1', ['localhost:8002', 'localhost:8003'], 8001); asyncio.run(lm.start())"

  node-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    ports:
      - "8002:8002"
    environment:
      - NODE_ID=node_2
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8002
      - NODE_COUNT=3
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

  node-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    ports:
      - "8003:8003"
    environment:
      - NODE_ID=node_3
      - NODE_HOST=0.0.0.0
      - NODE_PORT=8003
      - NODE_COUNT=3
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy

networks:
  default:
    name: dist-sync-network