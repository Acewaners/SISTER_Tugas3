version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  node-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    ports:
      - "8001:8001"
    environment:
      - NODE_ID=node_1
      - NODE_PORT=8001
      - NODE_TYPE=lock_manager
      - PEERS=node-2:8002,node-3:8003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "src.nodes.__main__", "--node-id", "node_1", "--port", "8001"]

  node-2:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    ports:
      - "8002:8002"
    environment:
      - NODE_ID=node_2
      - NODE_PORT=8002
      - NODE_TYPE=lock_manager
      - PEERS=node-1:8001,node-3:8003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "src.nodes.__main__", "--node-id", "node_2", "--port", "8002"]

  node-3:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    ports:
      - "8003:8003"
    environment:
      - NODE_ID=node_3
      - NODE_PORT=8003
      - NODE_TYPE=lock_manager
      - PEERS=node-1:8001,node-2:8002
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    command: ["python", "-m", "src.nodes.__main__", "--node-id", "node_3", "--port", "8003"]

networks:
  default:
    name: dist-sync-network