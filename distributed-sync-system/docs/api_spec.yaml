openapi: 3.0.0
info:
  title: API Sistem Sinkronisasi Terdistribusi
  description: Spesifikasi API untuk Endpoint TCP JSON Sistem Sinkronisasi Terdistribusi.
  version: 1.0.0

servers:
  - url: tcp://localhost:8001
    description: Node 1
  - url: tcp://localhost:8002
    description: Node 2
  - url: tcp://localhost:8003
    description: Node 3

paths:
  /lock_acquire:
    post:
      summary: Meminta Akses Kunci (Acquire Distributed Lock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  example: "lock_acquire"
                resource:
                  type: string
                  example: "file_A"
                lock_type:
                  type: string
                  enum: [SHARED, EXCLUSIVE]
                client_id:
                  type: string
                  example: "user_1"
      responses:
        '200':
          description: Hasil percobaan mendapatkan kunci (Lock)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /lock_release:
    post:
      summary: Melepas Akses Kunci (Release Distributed Lock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  example: "lock_release"
                resource:
                  type: string
                  example: "file_A"
                client_id:
                  type: string
                  example: "user_1"
      responses:
        '200':
          description: Hasil percobaan melepas kunci
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /queue_enqueue:
    post:
      summary: Menambahkan Pesan ke Antrean (Enqueue)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  example: "queue_enqueue"
                topic:
                  type: string
                  example: "orders"
                payload:
                  type: string
                  example: "order_data_123"
                producer_id:
                  type: string
                  example: "prod_1"
      responses:
        '200':
          description: Hasil Enqueue
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  msg_id:
                    type: string

  /queue_dequeue:
    post:
      summary: Mengambil Pesan dari Antrean (Dequeue)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  example: "queue_dequeue"
                topic:
                  type: string
                  example: "orders"
                consumer_id:
                  type: string
                  example: "cons_1"
      responses:
        '200':
          description: Pesan yang berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg_id:
                    type: string
                  payload:
                    type: string

  /get_status:
    post:
      summary: Mengambil status node kluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  example: "get_status"
      responses:
        '200':
          description: Statistik Node
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id:
                    type: string
                  raft_state:
                    type: object
                  queue_stats:
                    type: object
                  cache_stats:
                    type: object
                  failure_stats:
                    type: object